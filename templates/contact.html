{% include "header.html" %}
<section
  class="hero-section d-flex justify-content-center align-items-center"
  id="section_1"
>
  <div class="container">
    <!-- Google Ad Inside the same row -->
    <div class="row">
      <div class="col-lg-8 col-12">
        <div class="col-lg-8 col-12">
          {% comment %}
          <div
            class="google-auto-placed"
            style="width: 100%; height: auto; clear: both; text-align: center"
          >
            <!-- AdSense Ad -->
            <div class="adsense">
              <script
                async
                src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6644237537141647"
                crossorigin="anonymous"
              ></script>
              <!-- topAdd -->
              <ins
                class="adsbygoogle"
                style="display: block"
                data-ad-client="ca-pub-6644237537141647"
                data-ad-slot="9069859822"
                data-ad-format="auto"
                data-full-width-responsive="true"
              ></ins>
              <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
              </script>
            </div>
          </div>
          {% endcomment %}
        </div>
      </div>
    </div>
  </div>
</section>
<section class="section-padding section-bg">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 col-12">
        <h3 class="mb-4 pb-2">We'd love to hear from you</h3>
      </div>

      <div class="col-lg-6 col-12">
        <form id="contactForm" class="custom-form contact-form" role="form">
          {% csrf_token %}
          <div class="row">
            <div class="col-lg-6 col-md-6 col-12">
              <div class="form-floating">
                <input
                  type="text"
                  name="name"
                  id="name"
                  class="form-control"
                  placeholder="Name"
                  required=""
                />
                <label for="floatingInput">Name</label>
              </div>
            </div>

            <div class="col-lg-6 col-md-6 col-12">
              <div class="form-floating">
                <input
                  type="email"
                  name="email"
                  id="email"
                  pattern="[^ @]*@[^ @]*"
                  class="form-control"
                  placeholder="Email address"
                  required=""
                />
                <label for="floatingInput">Email address</label>
              </div>
            </div>

            <div class="col-lg-12 col-12">
              <div class="form-floating">
                <input
                  type="text"
                  name="subject"
                  id="subject"
                  class="form-control"
                  placeholder="Subject"
                  required=""
                />
                <label for="floatingInput">Subject</label>
              </div>

              <div class="form-floating">
                <textarea
                  class="form-control"
                  id="message"
                  name="message"
                  placeholder="Tell me about the project"
                ></textarea>
                <label for="floatingTextarea">Tell me about the project</label>
              </div>
            </div>

            <div class="col-lg-4 col-12 ms-auto">
              <button type="submit" class="form-control">Submit</button>
            </div>
          </div>
        </form>
        <script>
          document
            .getElementById("contactForm")
            .addEventListener("submit", function (event) {
              event.preventDefault(); // Prevent default form submission

              var formData = new FormData(this); // Collect form data
              var csrfToken = formData.get("csrfmiddlewaretoken"); // Get the CSRF token from the form

              fetch("{% url 'contact' %}", {
                method: "POST",
                headers: {
                  "X-CSRFToken": csrfToken, // Send the CSRF token here
                  Accept: "application/json", // Specify expected response type
                },
                body: formData,
              })
                .then((response) => {
                  if (!response.ok) {
                    throw new Error(
                      "Network response was not ok: " + response.statusText
                    );
                  }
                  return response.json();
                })
                .then((data) => {
                  if (data.success) {
                    alert("Thank you! Your message has been sent.");
                    window.location.href = "/"; // Redirect to homepage
                  } else {
                    alert("There was a problem sending your message.");
                  }
                })
                .catch((error) => {
                  console.error("Error:", error);
                  alert("An error occurred: " + error.message);
                });
            });
        </script>
      </div>

      <div class="col-lg-5 col-12 mx-auto mt-5 mt-lg-0">
        <h5 class="mt-4 mb-2">SynerSoft Technologies</h5>

        <p>Islamabad, Pakistan</p>
      </div>
    </div>
  </div>
</section>
{% include "footer.html" %}
